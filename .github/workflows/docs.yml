# Docs: build the MkDocs site and publish it to GitHub Pages (source: GitHub
# Actions, set once in the repo's Pages settings). Pull requests only build, in
# strict mode, so a broken page fails the check. Pushes to main also deploy.
# release.yml dispatches this after its changelog commit, which fires no push
# event of its own.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other; main runs queue, so an older run never
  # cancels a newer deployment.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: hatch-vcs needs them to install the package mkdocstrings imports

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --group docs

      - name: Build
        env:
          DISABLE_MKDOCS_2_WARNING: "true" # plugin and theme notices about a future MkDocs 2
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $head; the run for it deploys instead of this one ($GITHUB_SHA)."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@v4
