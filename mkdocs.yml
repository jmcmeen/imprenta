# The documentation site, published to GitHub Pages by .github/workflows/docs.yml.
# index.md, cli.md and changelog.md are generated at build time by docs/gen_pages.py
# (from README.md, the argparse help, CHANGELOG.md); api.md is mkdocstrings.
site_name: imprenta
site_description: A content arranger and styler, markdown in, products out
site_url: https://jmcmeen.github.io/imprenta/
repo_url: https://github.com/jmcmeen/imprenta
repo_name: jmcmeen/imprenta
edit_uri: ""
exclude_docs: gen_pages.py   # the generator is not a page
copyright: MIT licensed

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Overview: index.md
  - Command line: cli.md
  - API: api.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
